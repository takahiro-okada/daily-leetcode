name: Update solved log

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "README.md"

permissions:
  contents: write

jobs:
  update-solved-log:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README solved log
        run: node scripts/update-solved-log.js

      - name: Commit README update
        run: |
          if git diff --quiet README.md; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update solved log"
          git push
